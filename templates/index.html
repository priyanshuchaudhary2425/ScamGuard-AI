<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ScamGuard — AI Fraud Detection</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-purple-50 min-h-screen flex items-center justify-center font-sans">
  <div class="w-full max-w-2xl mx-auto p-6">
    <div class="text-center mb-6">
      <h1 class="text-4xl font-extrabold text-indigo-700 mb-2 tracking-tight">🤖 ScamGuard AI</h1>
      <p class="text-gray-600 text-lg">“Scam stopped. Confidence restored.”</p>
    </div>

    <div class="bg-white shadow-2xl rounded-2xl overflow-hidden border border-gray-200 flex flex-col" style="height: 400px; max-height: 400px;">
      <!-- Chat Window -->
      <div id="chat-window" class="flex-1 p-4 overflow-y-auto space-y-4 bg-gray-50"></div>

      <!-- Input -->
      <div class="border-t border-gray-200 p-4 flex items-center">
        <input id="chat-input" type="text" placeholder="Type a message..." class="flex-1 px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <button onclick="sendMessage()" class="ml-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-xl shadow-md transition duration-200">Send</button>
      </div>
    </div>

    <footer class="mt-8 text-center text-gray-400 text-sm">
      Built with ❤️ using AI & Flask for Hackathon 2025
    </footer>
  </div>

  <script>
    const chatWindow = document.getElementById('chat-window');
    const chatInput = document.getElementById('chat-input');

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      // Add user bubble
      addMessageBubble(text, 'user');
      chatInput.value = '';

      // Call backend
      try {
        const response = await fetch('/predict', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ texts: [text] })
        });
        const result = await response.json();
        if (result.results && result.results.length > 0) {
          const res = result.results[0];
          const isScam = res.label === 'Scam';
          const message = `${isScam ? '⚠️ Scam Detected' : '✅ Safe'} (Confidence: ${(res.confidence * 100).toFixed(2)}%)`;
          addMessageBubble(message, isScam ? 'scam' : 'safe');
        }
      } catch (err) {
        addMessageBubble(`❌ Request failed: ${err}`, 'error');
      }
    }

    function addMessageBubble(text, type) {
      const bubble = document.createElement('div');
      bubble.classList.add('max-w-[70%]', 'p-3', 'rounded-xl', 'shadow-md', 'text-sm', 'whitespace-pre-wrap');

      if (type === 'user') {
        bubble.classList.add('bg-indigo-100', 'self-end', 'ml-auto');
      } else if (type === 'scam') {
        bubble.classList.add('bg-red-100', 'border', 'border-red-400', 'text-red-800', 'self-start');
      } else if (type === 'safe') {
        bubble.classList.add('bg-green-100', 'border', 'border-green-400', 'text-green-800', 'self-start');
      } else {
        bubble.classList.add('bg-gray-200', 'text-gray-800', 'self-start');
      }

      bubble.textContent = text;
      chatWindow.appendChild(bubble);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    // Enter key to send
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
